name: Build APK and AAB Bundle

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Android APK & AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Generate Temporary Signing Keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias apexkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass apexpass123 \
            -keypass apexpass123 \
            -dname "CN=ApexVelocity, OU=Gaming, O=ApexStudio, L=Mumbai, S=Maharashtra, C=IN"

      - name: Build Signed APK and AAB
        run: |
          gradle assembleRelease bundleRelease \
            -PRELEASE_STORE_FILE=../release.keystore \
            -PRELEASE_STORE_PASSWORD=apexpass123 \
            -PRELEASE_KEY_ALIAS=apexkey \
            -PRELEASE_KEY_PASSWORD=apexpass123

      - name: Prepare Output Files
        run: |
          mkdir -p build_output
          cp app/build/outputs/apk/release/*.apk build_output/ApexVelocity3D-v1.0.apk || cp app/build/outputs/apk/release/*-unsigned.apk build_output/ApexVelocity3D-v1.0.apk
          cp app/build/outputs/bundle/release/*.aab build_output/ApexVelocity3D-v1.0.aab || cp app/build/outputs/bundle/release/*-unsigned.aab build_output/ApexVelocity3D-v1.0.aab
          echo "Output files ready in build_output:"
          ls -lh build_output/

      - name: Upload APK (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: ApexVelocity3D-APK
          path: build_output/ApexVelocity3D-v1.0.apk
          retention-days: 14

      - name: Upload AAB Bundle (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ApexVelocity3D-AAB-Bundle
          path: build_output/ApexVelocity3D-v1.0.aab
          retention-days: 14
