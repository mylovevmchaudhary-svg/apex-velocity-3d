name: Build APK and AAB Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Download Offline Three.js 3D Library into Assets
        run: |
          mkdir -p app/src/main/assets
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/three.min.js
          echo "Three.js downloaded successfully. Size:"
          ls -lh app/src/main/assets/three.min.js

      - name: Compile APK and AAB Bundle
        run: |
          gradle assembleDebug assembleRelease bundleRelease

      - name: Sign APK and AAB
        run: |
          mkdir -p build_output

          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias apexkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass apexpass123 \
            -keypass apexpass123 \
            -dname "CN=ApexVelocity, OU=Gaming, O=ApexStudio, L=Mumbai, S=MH, C=IN"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:apexpass123 --ks-key-alias apexkey --key-pass pass:apexpass123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build_output/ApexVelocity3D.apk $RELEASE_APK
          $APKSIGNER verify --verbose build_output/ApexVelocity3D.apk

          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          jarsigner -keystore release.keystore -storepass apexpass123 -keypass apexpass123 $AAB_FILE apexkey
          cp $AAB_FILE build_output/ApexVelocity3D-PlayStore.aab

          echo "Final builds ready in build_output:"
          ls -lh build_output/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ApexVelocity3D-APK
          path: build_output/ApexVelocity3D.apk
          retention-days: 14

      - name: Create Official GitHub Release (Direct Download)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.2
          name: "Apex Velocity 3D v1.0.2 (Direct APK Download)"
          body: |
            ### 🏁 Apex Velocity 3D - Direct Download

            📱 **Direct APK (No zip file, tap to install):**
            Download `ApexVelocity3D.apk` directly on your phone and tap to play!
          files: |
            build_output/ApexVelocity3D.apk
            build_output/ApexVelocity3D-PlayStore.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
