name: Build APK and AAB Bundle

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK & AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Download Offline Three.js 3D Library into Assets
        run: |
          mkdir -p app/src/main/assets
          curl -sL https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js -o app/src/main/assets/three.min.js
          echo "Three.js downloaded successfully. Size:"
          ls -lh app/src/main/assets/three.min.js

      - name: Compile APK and AAB Bundle
        run: |
          gradle assembleDebug assembleRelease bundleRelease

      - name: Sign APK with Official apksigner (v1 + v2 + v3)
        run: |
          mkdir -p build_output

          # Generate clean release keystore
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias apexkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass apexpass123 \
            -keypass apexpass123 \
            -dname "CN=ApexVelocity, OU=Gaming, O=ApexStudio, L=Mumbai, S=MH, C=IN"

          # Locate apksigner in Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          $APKSIGNER sign --ks release.keystore --ks-pass pass:apexpass123 --ks-key-alias apexkey --key-pass pass:apexpass123 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out build_output/ApexVelocity3D-Signed.apk $RELEASE_APK
          $APKSIGNER verify --verbose build_output/ApexVelocity3D-Signed.apk

          # Also copy Debug APK (Guaranteed 100% installable on any Android phone)
          cp app/build/outputs/apk/debug/*.apk build_output/ApexVelocity3D-Debug.apk

          # Sign AAB Bundle for Google Play Store
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab | head -n 1)
          jarsigner -keystore release.keystore -storepass apexpass123 -keypass apexpass123 $AAB_FILE apexkey
          cp $AAB_FILE build_output/ApexVelocity3D-PlayStore.aab

          echo "Final builds ready:"
          ls -lh build_output/

      - name: Upload APKs (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: ApexVelocity3D-APK
          path: |
            build_output/ApexVelocity3D-Signed.apk
            build_output/ApexVelocity3D-Debug.apk
          retention-days: 14

      - name: Upload AAB Bundle (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ApexVelocity3D-AAB-Bundle
          path: build_output/ApexVelocity3D-PlayStore.aab
          retention-days: 14
